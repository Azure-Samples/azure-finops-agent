    <!-- FAQ Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does Azure FinOps Agent help with?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Azure FinOps Agent combines Azure Cost Management, Resource Graph, Advisor, Log Analytics, Microsoft Graph and current Azure retail prices to answer cloud cost, governance and optimization questions in plain language."
            }
          },
          {
            "@type": "Question",
            "name": "Can Azure FinOps Agent analyze my own Azure costs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. After you connect Azure, the agent reads only the resources and cost data your identity is allowed to see, then keeps tenant data scoped to your session."
            }
          },
          {
            "@type": "Question",
            "name": "Does Azure FinOps Agent delete resources or make changes without approval?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Deletions are never available. Supported non-destructive changes require an explicit approval card, while destructive recommendations are delivered as scripts for you to review and run."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use Azure FinOps Agent without connecting Azure?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Signed-out users can compare public Azure retail prices, read guidance and upload a cost or usage export for analysis without connecting a tenant."
            }
          }
        ]
      }
    </script>
