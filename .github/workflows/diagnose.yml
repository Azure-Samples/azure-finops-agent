#     TEMPORARY diagnostic. Read-only: it never deploys, restarts or writes to
#     any Azure resource. Endpoint values are never printed, only their shape.
#
#     The production crash report shows an unhandled InvalidOperationException
#     from Program.<Main>, which is what ResolveProjectEndpoint throws for an
#     endpoint without /api/projects/ and no AzureOpenAI:ProjectName. This
#     compares the production and test-slot endpoint secrets and runs the
#     deployed image with the production one.
name: Diagnose production startup

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to reproduce against
        required: false
        default: c445c33

permissions:
  id-token: write
  contents: read

jobs:
  repro:
    name: Reproduce the startup exception
    runs-on: ubuntu-latest
    steps:
      - name: Describe the endpoint secrets without printing them
        env:
          PROD_ENDPOINT: ${{ secrets.AZURE_PROD_OPENAI_ENDPOINT }}
          SLOT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          describe() {
            local value="$1" host path suffix
            value="${value//[[:space:]]/}"
            host="${value#*://}"; host="${host%%/*}"
            path="/${value#*://*/}"
            suffix="${host#*.}"
            echo "  set=$([[ -n "$value" ]] && echo yes || echo no) https=$([[ "$value" == https://* ]] && echo yes || echo no) project_path=$([[ "$path" == */api/projects/* ]] && echo yes || echo no) host_type=*.$suffix path_depth=$(tr -cd / <<<"${value#*://}" | wc -c)"
          }
          host_of() { local v="${1//[[:space:]]/}"; v="${v#*://}"; echo "${v%%/*}"; }
          echo "AZURE_PROD_OPENAI_ENDPOINT (production):"; describe "$PROD_ENDPOINT"
          echo "AZURE_OPENAI_ENDPOINT (test slot):";      describe "$SLOT_ENDPOINT"
          echo "same value:   $([[ "$PROD_ENDPOINT" == "$SLOT_ENDPOINT" ]] && echo yes || echo no)"
          echo "same account: $([[ "$(host_of "$PROD_ENDPOINT" | cut -d. -f1)" == "$(host_of "$SLOT_ENDPOINT" | cut -d. -f1)" ]] && echo yes || echo no)"

      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.PROD_ACR_NAME }} --output none

      - name: Run the deployed image with each endpoint secret
        env:
          IMAGE: ${{ vars.PROD_CONTAINER_IMAGE }}:${{ inputs.tag }}
          PROD_ENDPOINT: ${{ secrets.AZURE_PROD_OPENAI_ENDPOINT }}
          SLOT_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          set -u
          docker pull -q "$IMAGE" > /dev/null
          for case in PROD_ENDPOINT SLOT_ENDPOINT; do
            echo "=================== $case ==================="
            docker run --rm \
              -e AGENT_HOME=/tmp/agent \
              -e AzureOpenAI__Endpoint="${!case}" \
              -e AzureOpenAI__DeploymentName=gpt-6-sol \
              -e AzureOpenAI__ReasoningEffort=xhigh \
              "$IMAGE" > out.txt 2>&1 &
            pid=$!
            sleep 15
            if kill -0 "$pid" 2>/dev/null; then
              echo "RESULT: still running after 15s (startup passed)"
              docker ps -q --filter "ancestor=$IMAGE" | xargs -r docker rm -f > /dev/null
              wait "$pid" 2>/dev/null
            else
              wait "$pid"; echo "RESULT: exited with code $?"
            fi
            grep -E 'Unhandled exception|Exception:|Now listening|Application starting' out.txt \
              | sed -E -e 's#https?://[^[:space:]"]+#<url>#g' -e 's#[A-Za-z0-9.-]+\.(azure\.com|azurecr\.io)#<host>#g' \
              | head -8
          done