#     TEMPORARY diagnostic workflow. Delete it together with the temporary
#     ungated-deploy commits. It never deploys or writes anything: it only reads
#     the production container log so the startup failure can be identified.
#
#     Every https URL, bearer token and GUID is redacted before printing, so no
#     endpoint coordinates or credentials reach the public Actions log.
name: Diagnose production startup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  logs:
    name: Read production container log
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Show which model settings exist, without their values
        env:
          WEBAPP_NAME: ${{ vars.PROD_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          echo "--- AzureOpenAI__* setting names ---"
          az webapp config appsettings list --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?starts_with(name, 'AzureOpenAI__')].name" --output tsv
          # Model and effort are plain names, not secrets, and are what a bad
          # rollback would have left behind. The endpoint stays redacted.
          echo "--- deployment name / reasoning effort ---"
          az webapp config appsettings list --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='AzureOpenAI__DeploymentName' || name=='AzureOpenAI__ReasoningEffort'].{name:name,value:value}" \
            --output tsv
          echo "--- endpoint shape only ---"
          az webapp config appsettings list --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='AzureOpenAI__Endpoint'].value" --output tsv \
            | sed -E -e 's#//[^./]+\.#//<account>.#' -e 's#/api/projects/.*#/api/projects/<project>#'
          echo "--- current image ---"
          az webapp config show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query linuxFxVersion --output tsv | sed -E 's#[A-Za-z0-9._-]+\.azurecr\.io#<registry>#g'

      - name: Print the redacted container log
        env:
          WEBAPP_NAME: ${{ vars.PROD_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.PROD_RESOURCE_GROUP }}
        run: |
          set -o pipefail
          az webapp log download --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" \
            --log-file logs.zip
          mkdir -p logs && unzip -o -q logs.zip -d logs

          # Redact anything that could carry deployment coordinates or a secret.
          redact() {
            sed -E \
              -e 's#https://[^[:space:]"]+#<url>#g' \
              -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}#<guid>#g' \
              -e 's#(Bearer|ey)[A-Za-z0-9._-]{10,}#<token>#g'
          }

          latest=$(find logs -type f -name '*.log' -newermt '2026-09-29 17:30' 2>/dev/null | head -40)
          if [ -z "$latest" ]; then
            latest=$(find logs -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -8 | cut -d' ' -f2-)
          fi
          echo "=================== files downloaded ==================="
          find logs -type f | head -60
          for file in $latest; do
            echo "=================== $file ==================="
            # The crashed container's own stdout is what matters, so keep any
            # line that is not routine App Service platform chatter.
            grep -vE 'Nested mountpoint|named pipe|Establishing |Mounting volumes|Starting watchers|metrics collection|DetailsLevel: INFO' "$file" \
              | tail -80 | redact
          done
