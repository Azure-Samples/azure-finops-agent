#     TEMPORARY diagnostic. Read-only: it never deploys, restarts or writes to
#     any Azure resource. It runs the already-built production image locally on
#     the runner and reproduces the startup crash.
#
#     The image starts fine on a bare runner but segfaults (exit 139, ~1s, no
#     output) on App Service. The App Service detectors in the Azure Monitor
#     OpenTelemetry distro only activate when WEBSITE_* variables exist, so the
#     bare runner never exercised that path. Each case below adds one part of
#     the App Service environment to find which one kills the process.
name: Diagnose production startup

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to reproduce against
        required: false
        default: 6e99d91

permissions:
  id-token: write
  contents: read

jobs:
  repro:
    name: Reproduce the startup crash
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.PROD_ACR_NAME }}

      - name: Run the image under increasing amounts of App Service environment
        env:
          IMAGE: ${{ vars.PROD_CONTAINER_IMAGE }}
          TAG: ${{ inputs.tag }}
        run: |
          set -u
          docker pull "$IMAGE:$TAG"

          # A synthetic connection string: the crash is expected from the code
          # path that reads it, not from any real resource, so no secret is used.
          FAKE_AI='InstrumentationKey=00000000-0000-0000-0000-000000000000;IngestionEndpoint=https://westeurope-5.in.applicationinsights.azure.com/;LiveEndpoint=https://westeurope.livediagnostics.monitor.azure.com/'

          run_case() {
            name="$1"; shift
            echo "=================== CASE: $name ==================="
            set +e
            docker run --rm --name "case" \
              -e ASPNETCORE_URLS=http://+:8080 \
              -e AGENT_HOME=/tmp/agent \
              -e AzureOpenAI__Endpoint=https://example.services.ai.azure.com/api/projects/diag \
              -e AzureOpenAI__DeploymentName=gpt-6-sol \
              "$@" \
              --entrypoint /bin/bash "$IMAGE:$TAG" \
              -c 'mkdir -p "$AGENT_HOME/users" "$AGENT_HOME/anon"; timeout 25 dotnet Dashboard.dll; echo "EXIT=$?"' 2>&1 \
              | sed -E 's#https://[^[:space:]",]+#<url>#g' | tail -25
            set -e
            echo
          }

          # 1. Baseline: what the earlier preflight already proved works.
          run_case "bare runner (no App Service variables)"

          # 2. App Service identity variables only.
          run_case "WEBSITE_* present" \
            -e WEBSITE_SITE_NAME=diag-site \
            -e WEBSITE_RESOURCE_GROUP=diag-rg \
            -e WEBSITE_OWNER_NAME=00000000-0000-0000-0000-000000000000+diag-rg-EuropeNorthwebspace \
            -e WEBSITE_INSTANCE_ID=diaginstance \
            -e WEBSITE_HOSTNAME=diag-site.azurewebsites.net

          # 3. Application Insights only.
          run_case "Application Insights connection string present" \
            -e APPLICATIONINSIGHTS_CONNECTION_STRING="$FAKE_AI" \
            -e ApplicationInsights__ConnectionString="$FAKE_AI"

          # 4. Both, which is what production actually runs with.
          run_case "full App Service environment (production shape)" \
            -e WEBSITE_SITE_NAME=diag-site \
            -e WEBSITE_RESOURCE_GROUP=diag-rg \
            -e WEBSITE_OWNER_NAME=00000000-0000-0000-0000-000000000000+diag-rg-EuropeNorthwebspace \
            -e WEBSITE_INSTANCE_ID=diaginstance \
            -e WEBSITE_HOSTNAME=diag-site.azurewebsites.net \
            -e APPLICATIONINSIGHTS_CONNECTION_STRING="$FAKE_AI" \
            -e ApplicationInsights__ConnectionString="$FAKE_AI"
