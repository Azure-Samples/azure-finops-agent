version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/Dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]
    groups:
      otel:
        patterns: ["OpenTelemetry*", "Azure.Monitor.OpenTelemetry*"]
      azure:
        patterns: ["Azure.*"]
      identity-model:
        patterns: ["Microsoft.IdentityModel.*", "System.IdentityModel.*"]
      msal:
        patterns: ["Microsoft.Identity.Client", "Microsoft.Identity.Client.Extensions.Msal"]

  - package-ecosystem: nuget
    directory: /tests/Dashboard.Tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]
    groups:
      test-tooling:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]

  - package-ecosystem: npm
    directory: /src/Dashboard/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      vue:
        patterns: ["vue*", "@vitejs/*", "vite"]
      echarts:
        patterns: ["echarts*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /src/Dashboard
    schedule:
      interval: weekly
    labels: [dependencies, docker]