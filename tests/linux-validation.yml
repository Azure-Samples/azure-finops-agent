version: v1.1.0
stepTimeout: 1800
steps:
  - cmd: >-
      mcr.microsoft.com/dotnet/sdk:10.0 bash -ec
      'apt-get update -qq;
      apt-get install -y --no-install-recommends python3 python3-pip;
      python3 -m pip install --break-system-packages pandas openpyxl;
      dotnet test tests/Dashboard.Tests/Dashboard.Tests.csproj --nologo --verbosity minimal;
      python3 -m unittest discover -s tests -p "test_*.py" -v'
    id: regressions
  - cmd: >-
      node:26-slim bash -ec
      'npm ci --no-audit --no-fund;
      npm run test;
      npx playwright install --with-deps chromium;
      npm run test:browser;
      npm run build'
    workingDirectory: /workspace/src/Dashboard/frontend
    env: ["CI=true"]
    id: frontend
  - build: -t finops-validation:{{.Run.ID}} -f src/Dashboard/Dockerfile src/Dashboard
    id: image
  - cmd: finops-validation:{{.Run.ID}} /workspace/tests/container_smoke.py
    entryPoint: python3
    workingDirectory: /app
    id: smoke
  - cmd: docker save finops-validation:{{.Run.ID}} -o /workspace/validation-image.tar
    id: archive
  - cmd: >-
      aquasec/trivy:0.74.0 image --input /workspace/validation-image.tar
      --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress
      --format table --skip-version-check
    id: runtime-vulnerabilities